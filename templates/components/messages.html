{% if messages %}
  <div class="app-messages" aria-live="polite" aria-atomic="true">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible" role="status">
        {{ message }}
        <button type="button" class="btn-close" data-dismiss-message aria-label="Cerrar mensaje"></button>
      </div>
    {% endfor %}
  </div>
{% endif %}
