[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py tests.py
testpaths = tests apps
addopts = -ra --strict-markers
markers =
    unit: reglas aisladas sin acceso a infraestructura
    integration: integración con Django y PostgreSQL
    functional: flujos observables mediante el cliente web
    security: autenticación, autorización y protección de datos
    concurrency: transacciones y condiciones de carrera sobre PostgreSQL

